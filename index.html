<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TZ Movie Recap Studio Pro</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: sans-serif;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1f2833;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        h2 { color: #66fcf1; text-align: center; }
        .upload-box {
            border: 2px dashed #45f3ff;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 20px;
            background: #0b0c10;
        }
        .btn {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .result-box {
            margin-top: 20px;
            background: #0b0c10;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #45f3ff;
            min-height: 100px;
            white-space: pre-wrap;
        }
        .status { color: #ffc107; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>TZ Movie Recap Studio Pro</h2>
    <p style="text-align:center;font-size:12px;color:#aaa;">ဗီဒီယိုများကို အလိုအလျောက် မြန်မာဘာသာပြန်ပေးမည့်စနစ်</p>
    
    <div class="upload-box">
        <input type="file" id="videoInput" accept="video/*">
        <p style="font-size:12px; color:#66fcf1; margin-top:5px;">ဗီဒီယိုဖိုင် ရွေးချယ်ပါ</p>
    </div>

    <button class="btn" onclick="startProcess()">⚡ အစအဆုံး အလိုအလျောက် ဘာသာပြန်မည်</button>
    
    <div class="status" id="statusText"></div>

    <h4 style="margin-top:20px; color:#66fcf1;">မြန်မာဘာသာပြန်စာသားများ</h4>
    <div class="result-box" id="resultText">ရလဒ်များကို ဤနေရာတွင် ပြသပေးပါမည်...</div>
</div>

<script>
// သင့်ရဲ့ Gemini API Key
const API_KEY = "AQ.Ab8RN6IFKeUbIUYUDsbsQpkSmiVFH8JdL8ylzeUBruQBonpPzg";

async function startProcess() {
    const fileInput = document.getElementById('videoInput');
    const statusText = document.getElementById('statusText');
    const resultText = document.getElementById('resultText');

    if (!fileInput.files[0]) {
        alert("ကျေးဇူးပြု၍ ဗီဒီယိုဖိုင်တစ်ခု အရင်ရွေးချယ်ပေးပါ!");
        return;
    }

    const file = fileInput.files[0];
    statusText.innerText = "⏳ ဗီဒီယိုကို စစ်ဆေးနေပါသည်... (ဖိုင်ကြီးလျှင် ခေတ္တစောင့်ပါ)";
    resultText.innerText = "";

    try {
        const base64Data = await fileToBase64(file);
        statusText.innerText = "⏳ Gemini AI ဆီသို့ ပေးပို့ပြီး ဘာသာပြန်နေပါသည်...";

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                contents: [{
                    parts: [
                        { inlineData: { mimeType: file.type, data: base64Data } },
                        { text: "ဒီဗီဒီယိုထဲက အသံကို နားထောင်ပြီး မြန်မာလို အဓိပ္ပာယ်ပြည့်စုံစွာ ဘာသာပြန်ပေးပါ။ ရလဒ်ကို 'စာပိုဒ် ၁'၊ 'စာပိုဒ် ၂' စသဖြင့် ခေါင်းစဉ်များဖြင့် အပိုင်းလိုက် သေချာခွဲခြားပေးပါ။" }
                    ]
                }]
            })
        });

        const json = await response.json();
        
        if(json.candidates && json.candidates[0].content.parts[0].text) {
            statusText.innerText = "✅ ဘာသာပြန်ဆိုမှု အောင်မြင်ပါပြီ!";
            resultText.innerText = json.candidates[0].content.parts[0].text;
        } else {
            statusText.innerText = "❌ အမှားအယွင်းရှိသွားပါသည်။";
            resultText.innerText = JSON.stringify(json);
        }

    } catch (error) {
        statusText.innerText = "❌ ချိတ်ဆက်မှု မအောင်မြင်ပါနော်။";
        resultText.innerText = error.message;
    }
}

function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
    });
}
</script>

</body>
  </html>
